<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc" id="d-02-metodologi-pengembangan-root">
        <title id="flowchart-title">Metodologi Pengembangan Sistem SIMASADI</title>
        <desc id="flowchart-desc">Alur iteratif pengembangan sistem SIMASADI mulai dari analisis regulasi KAN, perancangan cepat, implementasi rule engine, simulasi uji, evaluasi kepatuhan dengan siklus loop balik, hingga finalisasi rilis.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-metodologi-pengembangan-root { --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-02-metodologi-pengembangan-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-02-metodologi-pengembangan-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-02-metodologi-pengembangan-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-02-metodologi-pengembangan-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="d-02-metodologi-pengembangan-arrow-loop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
          </marker>
          <marker id="d-02-metodologi-pengembangan-arrow-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="1000" height="432" fill="#f8fafc" rx="8"/>

        <!-- Flow Connectors (drawn behind nodes) -->
        <!-- Step 1 → Step 2 -->
        <line x1="190" y1="160" x2="230" y2="160" stroke="#475569" stroke-width="1.2" marker-end="url(#d-02-metodologi-pengembangan-arrow)"/>

        <!-- Step 2 → Step 3 -->
        <line x1="380" y1="160" x2="420" y2="160" stroke="#475569" stroke-width="1.2" marker-end="url(#d-02-metodologi-pengembangan-arrow)"/>

        <!-- Step 3 → Step 4 -->
        <line x1="570" y1="160" x2="610" y2="160" stroke="#475569" stroke-width="1.2" marker-end="url(#d-02-metodologi-pengembangan-arrow)"/>

        <!-- Step 4 → Decision Diamond -->
        <line x1="760" y1="160" x2="800" y2="160" stroke="#475569" stroke-width="1.2" marker-end="url(#d-02-metodologi-pengembangan-arrow)"/>

        <!-- Feedback Loop: Decision Diamond (Top) → Step 2 (Top) -->
        <path d="M 860 110 L 860 56 Q 860 48 852 48 L 313 48 Q 305 48 305 56 L 305 130" fill="none" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#d-02-metodologi-pengembangan-arrow-loop)"/>

        <!-- Feedback Loop Masked Label -->
        <rect x="500" y="40" width="160" height="16" rx="3" fill="#f8fafc"/>
        <text x="580" y="52" fill="#0284c7" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.04em">BUTUH PENYESUAIAN ATURAN</text>

        <!-- Exit: Decision Diamond (Bottom) → Terminal Step 5 -->
        <line x1="860" y1="210" x2="860" y2="290" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d-02-metodologi-pengembangan-arrow-success)"/>

        <!-- Exit Masked Label -->
        <rect x="795" y="242" width="130" height="16" rx="3" fill="#f8fafc"/>
        <text x="860" y="254" fill="#16a34a" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">SESUAI REGULASI KAN</text>

        <!-- Nodes Row 1 (y = 130, h = 60) -->
        <!-- Node 1: Input / Requirements -->
        <g transform="translate(40, 130)">
          <rect width="150" height="60" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.12em">TAHAP 1 · INISIASI</text>
          <text x="12" y="38" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="600">Analisis Regulasi</text>
          <text x="12" y="51" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">Pedoman KAN U-01 &amp; SLA</text>
        </g>

        <!-- Node 2: Design -->
        <g transform="translate(230, 130)">
          <rect width="150" height="60" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.12em">TAHAP 2 · RANCANG</text>
          <text x="12" y="38" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="600">Perancangan Cepat</text>
          <text x="12" y="51" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">Logika Aturan &amp; Antarmuka</text>
        </g>

        <!-- Node 3: Core Implementation -->
        <g transform="translate(420, 130)">
          <rect width="150" height="60" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.12em">TAHAP 3 · BANGUN</text>
          <text x="12" y="38" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="600">Prototype &amp; Engine</text>
          <text x="12" y="51" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">Toleransi, SLA &amp; Importer</text>
        </g>

        <!-- Node 4: Testing & Simulation -->
        <g transform="translate(610, 130)">
          <rect width="150" height="60" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.12em">TAHAP 4 · VERIFIKASI</text>
          <text x="12" y="38" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="600">Uji Otomatis &amp; Simulasi</text>
          <text x="12" y="51" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">183 Automated Tests</text>
        </g>

        <!-- Decision Diamond: Aturan Sesuai? (Center: 860, 160) -->
        <g transform="translate(860, 160)">
          <polygon points="0,-50 60,0 0,50 -60,0" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
          <text x="0" y="-8" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.1em">EVALUASI</text>
          <text x="0" y="8" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Kepatuhan KAN</text>
          <text x="0" y="22" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tervalidasi?</text>
        </g>

        <!-- Bottom Row (y = 290, h = 80) -->
        <!-- Summary Card 1: Regulasi KAN -->
        <g transform="translate(40, 290)">
          <rect width="210" height="80" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1" stroke-opacity="0.12"/>
          <text x="14" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">PRINSIP SDLC #1</text>
          <text x="14" y="44" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Iterasi Regulasi KAN</text>
          <text x="14" y="60" fill="#475569" font-size="9.5" font-family="'Geist', sans-serif" line-height="1.4">Toleransi surveilen &amp; SLA TP</text>
          <text x="14" y="72" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">diverifikasi tiap sprint.</text>
        </g>

        <!-- Summary Card 2: Feedback Loop -->
        <g transform="translate(270, 290)">
          <rect width="210" height="80" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1" stroke-opacity="0.12"/>
          <text x="14" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">PRINSIP SDLC #2</text>
          <text x="14" y="44" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Umpan Balik Cepat</text>
          <text x="14" y="60" fill="#475569" font-size="9.5" font-family="'Geist', sans-serif">Pengujian interaktif peran ganda</text>
          <text x="14" y="72" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">Ketua Tim &amp; PIC Lab.</text>
        </g>

        <!-- Summary Card 3: Quality Gate -->
        <g transform="translate(500, 290)">
          <rect width="220" height="80" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1" stroke-opacity="0.12"/>
          <text x="14" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">PRINSIP SDLC #3</text>
          <text x="14" y="44" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Bebas Slop &amp; Kontras Tinggi</text>
          <text x="14" y="60" fill="#475569" font-size="9.5" font-family="'Geist', sans-serif">Standar aksesibilitas WCAG AA,</text>
          <text x="14" y="72" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">tata letak data intuitif.</text>
        </g>

        <!-- Terminal Node 5: Final Release (Focal / Success) -->
        <g transform="translate(740, 290)">
          <rect width="220" height="80" rx="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.4" fill-opacity="0.06"/>
          <text x="16" y="24" fill="#16a34a" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">TAHAP 5 · SELESAI</text>
          <text x="16" y="44" fill="#14532d" font-size="12.5" font-family="'Geist', sans-serif" font-weight="700">Finalisasi &amp; Dokumentasi</text>
          <text x="16" y="60" fill="#15803d" font-size="9.5" font-family="'Geist', sans-serif">Uji regresi 100% lolos,</text>
          <text x="16" y="72" fill="#16a34a" font-size="9" font-family="'Geist Mono', monospace">baseline siap rilis.</text>
        </g>

        <!-- Footer Caption -->
        <text x="40" y="416" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace">SIMASADI SDLC · ITERATIVE PROTOTYPING • 5 TAHAPAN SIKLUS HIDUP • SESUAI REGULASI KAN U-01</text>
      </svg>
