<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Diagram: Perencanaan & Penjadwalan Asesmen KAN · SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --color-purple:  #7c3aed;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1160px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ACTIVITY DIAGRAM · JADWAL ASESMEN</p>
    <h1>Activity Diagram: Perencanaan & Penjadwalan Asesmen KAN</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1020 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d10-title d10-desc">
        <title id="d10-title">Activity Diagram: Perencanaan &amp; Penjadwalan Asesmen KAN</title>
        <desc id="d10-desc">Diagram alur penjadwalan 8 tipe asesmen lapangan KAN U-01, validasi konsistensi rentang tanggal, inisialisasi batas waktu SLA tindakan perbaikan, dan sinkronisasi otomatis kalender kerja.</desc>
        <defs>
          <marker id="d10-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="d10-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker>
          <marker id="d10-arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e11d48"/></marker>
        </defs>

        <rect width="1020" height="480" fill="#f8fafc" rx="8"/>

        <!-- Flow Lines Top -->
        <line x1="80" y1="120" x2="110" y2="120" stroke="#475569" stroke-width="1.2" marker-end="url(#d10-arrow)"/>
        <line x1="250" y1="120" x2="280" y2="120" stroke="#475569" stroke-width="1.2" marker-end="url(#d10-arrow)"/>
        <line x1="420" y1="120" x2="450" y2="120" stroke="#475569" stroke-width="1.2" marker-end="url(#d10-arrow)"/>
        <line x1="600" y1="120" x2="630" y2="120" stroke="#475569" stroke-width="1.2" marker-end="url(#d10-arrow)"/>
        <line x1="770" y1="120" x2="800" y2="120" stroke="#475569" stroke-width="1.2" marker-end="url(#d10-arrow)"/>

        <!-- Choice: Validasi Tanggal (Center: 850, 120) -->
        <!-- Gagal (Top loop back) -->
        <path d="M 850 75 L 850 40 Q 850 32 842 32 L 368 32 Q 360 32 360 40 L 360 85" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#d10-arrow-danger)"/>
        <rect x="520" y="24" width="180" height="16" rx="3" fill="#f8fafc"/>
        <text x="610" y="36" fill="#e11d48" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">GAGAL: end_at &lt; start_at</text>

        <!-- Berhasil (Down to Container Otomasi) -->
        <line x1="850" y1="165" x2="850" y2="240" stroke="#0284c7" stroke-width="1.6" marker-end="url(#d10-arrow-accent)"/>
        <rect x="770" y="195" width="160" height="16" rx="3" fill="#f8fafc"/>
        <text x="850" y="207" fill="#0284c7" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TANGGAL VALID (end_at &ge; start_at)</text>

        <!-- Container Otomasi Backend -->
        <rect x="260" y="240" width="720" height="150" rx="8" fill="rgba(2,132,199,0.03)" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,4"/>
        <text x="280" y="264" fill="#0284c7" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700" letter-spacing="0.12em">OTOMASI SISTEM: INITIALIZE PARAMETER KAN</text>

        <!-- Inside Container Flow -->
        <line x1="720" y1="320" x2="680" y2="320" stroke="#0284c7" stroke-width="1.3" marker-end="url(#d10-arrow-accent)"/>
        <line x1="510" y1="320" x2="470" y2="320" stroke="#0284c7" stroke-width="1.3" marker-end="url(#d10-arrow-accent)"/>
        <line x1="290" y1="320" x2="220" y2="320" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d10-arrow)"/>

        <!-- NODES TOP ROW -->
        <!-- Start -->
        <g transform="translate(40, 105)"><circle cx="15" cy="15" r="14" fill="#0f172a"/></g>

        <!-- Step 1: Pilih LPK -->
        <g transform="translate(110, 85)">
          <rect width="140" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="10" y="20" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">LANGKAH 1</text>
          <text x="10" y="38" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Pilih LPK Sasaran</text>
          <text x="10" y="52" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Detail LPK (/lpks/{id})</text>
        </g>

        <!-- Step 2: Form Tambah Asesmen -->
        <g transform="translate(280, 85)">
          <rect width="140" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="10" y="20" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">LANGKAH 2</text>
          <text x="10" y="38" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Formulir Asesmen</text>
          <text x="10" y="52" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">/assessments/create</text>
        </g>

        <!-- Step 3: Pilih 8 Tipe KAN -->
        <g transform="translate(450, 85)">
          <rect width="150" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="10" y="20" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">LANGKAH 3</text>
          <text x="10" y="38" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Pilih 1 dari 8 Tipe</text>
          <text x="10" y="52" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">AA, S1, S2, PRL, RA, STT</text>
        </g>

        <!-- Step 4: Input Tanggal & Lead Assessor -->
        <g transform="translate(630, 85)">
          <rect width="140" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="10" y="20" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">LANGKAH 4</text>
          <text x="10" y="38" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Tanggal &amp; Asesor</text>
          <text x="10" y="52" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">start_at &amp; end_at</text>
        </g>

        <!-- Choice: Validasi Tanggal (Center: 850, 120) -->
        <g transform="translate(850, 120)">
          <polygon points="0,-45 50,0 0,45 -50,0" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <text x="0" y="-8" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">VALIDASI</text>
          <text x="0" y="8" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Konsistensi</text>
          <text x="0" y="20" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">end &ge; start</text>
        </g>

        <!-- NODES INSIDE CONTAINER (Right to Left) -->
        <!-- Auto 1: Status & SLA TP (720, 285) -->
        <g transform="translate(720, 285)">
          <rect width="200" height="70" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
          <text x="10" y="20" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">OTOMASI 1 &bull; SLA TP</text>
          <text x="10" y="36" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="700">Kalkulasi tp_due_date</text>
          <text x="10" y="50" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">AA: 3 Bulan &bull; Lainnya: 2 Bulan</text>
        </g>

        <!-- Auto 2: Toleransi Surveilen (510, 285) -->
        <g transform="translate(510, 285)">
          <rect width="170" height="70" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
          <text x="10" y="20" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">OTOMASI 2 &bull; TOLERANSI</text>
          <text x="10" y="36" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="700">submission_due_date</text>
          <text x="10" y="50" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Maks 4 Bulan dr Bulan 15</text>
        </g>

        <!-- Auto 3: Generate Kalender (290, 285) -->
        <g transform="translate(290, 285)">
          <rect width="180" height="70" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
          <text x="10" y="20" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">OTOMASI 3 &bull; KALENDER</text>
          <text x="10" y="36" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="700">Generate Event Otomatis</text>
          <text x="10" y="50" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Insert ke calendar_events</text>
        </g>

        <!-- Detail Asesmen Baru (Left: 40, 275) -->
        <g transform="translate(40, 275)">
          <rect width="180" height="85" rx="8" fill="rgba(22,163,74,0.06)" stroke="#16a34a" stroke-width="1.5"/>
          <text x="12" y="22" fill="#16a34a" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">TERJADWAL &amp; TERPANTAU</text>
          <text x="12" y="42" fill="#14532d" font-size="12" font-family="'Geist', sans-serif" font-weight="700">Detail Asesmen Baru</text>
          <text x="12" y="56" fill="#15803d" font-size="8.5" font-family="'Geist Mono', monospace">/assessments/{id}</text>
          <text x="12" y="70" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">Countdown SLA &amp; TP Tracking Aktif</text>
        </g>

        <!-- Footer -->
        <text x="40" y="440" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace">PENJADWALAN ASESMEN KAN &bull; OTOMASI TANGGAL TOLERANSI &amp; SINKRONISASI JADWAL KALENDER KERJA OTOMATIS</text>
      </svg>
    </div>
  </div>
</body>
</html>
