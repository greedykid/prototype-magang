<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc" id="d-04-01-navigasi-utama-root">
        <title id="d1-title">Struktur Navigasi Utama Sistem SIMASADI</title>
        <desc id="d1-desc">Diagram struktur navigasi tingkat utama menghubungkan otentikasi sesi login, dasbor eksekutif, serta empat menu utama operasional yang saling terhubung horizontal.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-04-01-navigasi-utama-root { --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-04-01-navigasi-utama-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-04-01-navigasi-utama-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-04-01-navigasi-utama-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-04-01-navigasi-utama-d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="d-04-01-navigasi-utama-d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
          </marker>
        </defs>

        <rect width="1000" height="460" fill="#f8fafc" rx="8"/>

        <!-- Connectors -->
        <!-- Login <-> Dashboard -->
        <line x1="190" y1="210" x2="270" y2="210" stroke="#0284c7" stroke-width="1.6" marker-end="url(#d-04-01-navigasi-utama-d1-arrow-accent)"/>
        <line x1="270" y1="210" x2="190" y2="210" stroke="#0284c7" stroke-width="1.6" marker-end="url(#d-04-01-navigasi-utama-d1-arrow-accent)"/>

        <!-- Dashboard to Bus Trunk -->
        <line x1="470" y1="210" x2="550" y2="210" stroke="#475569" stroke-width="1.4"/>

        <!-- Bus Trunk Vertical Backbone -->
        <line x1="550" y1="80" x2="550" y2="380" stroke="#475569" stroke-width="1.4"/>

        <!-- Branches to 4 Menus -->
        <line x1="550" y1="80" x2="630" y2="80" stroke="#475569" stroke-width="1.2" marker-end="url(#d-04-01-navigasi-utama-d1-arrow)"/>
        <line x1="550" y1="180" x2="630" y2="180" stroke="#475569" stroke-width="1.2" marker-end="url(#d-04-01-navigasi-utama-d1-arrow)"/>
        <line x1="550" y1="280" x2="630" y2="280" stroke="#475569" stroke-width="1.2" marker-end="url(#d-04-01-navigasi-utama-d1-arrow)"/>
        <line x1="550" y1="380" x2="630" y2="380" stroke="#475569" stroke-width="1.2" marker-end="url(#d-04-01-navigasi-utama-d1-arrow)"/>

        <!-- Inter-Menu Bi-directional Ring (Horizontal links on the right) -->
        <path d="M 870 80 L 910 80 L 910 380 L 870 380" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
        <line x1="870" y1="180" x2="910" y2="180" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
        <line x1="870" y1="280" x2="910" y2="280" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>

        <!-- Node: Login -->
        <g transform="translate(40, 175)">
          <rect width="150" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
          <text x="14" y="24" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">AUTENTIKASI</text>
          <text x="14" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="700">Halaman Login</text>
          <text x="14" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/login • reCAPTCHA v2</text>
        </g>

        <!-- Node: Dashboard (Focal Hero) -->
        <g transform="translate(270, 165)">
          <rect width="200" height="90" rx="8" fill="#0284c7" stroke="#0284c7" stroke-width="1.8" fill-opacity="0.06"/>
          <text x="16" y="26" fill="#0284c7" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" letter-spacing="0.14em">PUSAT OPERASIONAL</text>
          <text x="16" y="48" fill="#0f172a" font-size="15" font-family="'Geist', sans-serif" font-weight="700">Dashboard Utama</text>
          <text x="16" y="65" fill="#475569" font-size="9.5" font-family="'Geist Mono', monospace">/dashboard • KPI &amp; Alert</text>
          <text x="16" y="78" fill="#16a34a" font-size="8.5" font-family="'Geist Mono', monospace">Peran: Ketua Tim &amp; PIC Lab</text>
        </g>

        <!-- 4 Main Menus -->
        <!-- Menu 1: LPK -->
        <g transform="translate(630, 45)">
          <rect width="240" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">MODUL 1 · MASTER DATA</text>
          <text x="16" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Data Master LPK</text>
          <text x="16" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/lpks • Profil, Lingkup &amp; PIC</text>
        </g>

        <!-- Menu 2: Asesmen -->
        <g transform="translate(630, 145)">
          <rect width="240" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">MODUL 2 · AGENDA KAN</text>
          <text x="16" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Program Asesmen</text>
          <text x="16" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/assessments • 8 Skema &amp; SLA TP</text>
        </g>

        <!-- Menu 3: Kalender -->
        <g transform="translate(630, 245)">
          <rect width="240" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">MODUL 3 · KOORDINASI</text>
          <text x="16" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Kalender Pengawasan</text>
          <text x="16" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/calendar • Multi-Event Grid</text>
        </g>

        <!-- Menu 4: Profil & Tim -->
        <g transform="translate(630, 345)">
          <rect width="240" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">MODUL 4 · AKUN &amp; TIM</text>
          <text x="16" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Profil &amp; Kolaborasi Tim</text>
          <text x="16" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/profile • Tautan Akun PIC</text>
        </g>

        <!-- Bottom Legend -->
        <text x="40" y="440" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace">STRUKTUR TINGKAT UTAMA • GARIS PUTUS-PUTUS MENUNJUKKAN TAUTAN HORIZONTAL ANTAR-MODUL TANPA KEMBALI KE DASBOR</text>
      </svg>
