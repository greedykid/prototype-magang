<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequence Diagram Verifikasi Alur EHA & Quality Gate Rilis SK · SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --color-purple:  #7c3aed;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1160px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DIAGRAM 4.13 · SEQUENCE DIAGRAM</p>
    <h1>Sequence Diagram Verifikasi Alur EHA & Quality Gate Rilis SK</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1060 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d13-title d13-desc">
        <title id="d13-title">Sequence Diagram Verifikasi Alur EHA dan Quality Gate Rilis SK</title>
        <desc id="d13-desc">Interaksi sekuensial antara Admin Ketua Tim, Blade View, AssessmentController, Eloquent Model, dan SQLite Database pada verifikasi sidang EHA serta penegakan Quality Gate Lock saat penerbitan SK akreditasi.</desc>
        <defs>
          <marker id="d13-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker>
          <marker id="d13-arrow-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
          <marker id="d13-arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e11d48"/></marker>
          <marker id="d13-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#16a34a"/></marker>
        </defs>

        <rect width="1060" height="760" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

        <!-- Lifelines vertical dashed lines -->
        <line x1="110" y1="84" x2="110" y2="700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>
        <line x1="310" y1="84" x2="310" y2="700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>
        <line x1="530" y1="84" x2="530" y2="700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>
        <line x1="750" y1="84" x2="750" y2="700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>
        <line x1="950" y1="84" x2="950" y2="700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>

        <!-- Participant Boxes (Top) -->
        <g transform="translate(40, 28)">
          <rect width="140" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
          <text x="70" y="24" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Admin Unit Lab</text>
          <text x="70" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">&lt;&lt;actor&gt;&gt; Ketua Tim</text>
        </g>

        <g transform="translate(240, 28)">
          <rect width="140" height="52" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
          <text x="70" y="24" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#0369a1" text-anchor="middle">Detail Page</text>
          <text x="70" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7" text-anchor="middle">&lt;&lt;view&gt;&gt; Blade UI</text>
        </g>

        <g transform="translate(450, 28)">
          <rect width="160" height="52" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
          <text x="80" y="24" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#0369a1" text-anchor="middle">AssessmentController</text>
          <text x="80" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7" text-anchor="middle">&lt;&lt;controller&gt;&gt;</text>
        </g>

        <g transform="translate(680, 28)">
          <rect width="140" height="52" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
          <text x="70" y="24" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#6d28d9" text-anchor="middle">Assessment Model</text>
          <text x="70" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#7c3aed" text-anchor="middle">&lt;&lt;eloquent&gt;&gt;</text>
        </g>

        <g transform="translate(880, 28)">
          <rect width="140" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
          <text x="70" y="24" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">SQLite Database</text>
          <text x="70" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">&lt;&lt;storage&gt;&gt;</text>
        </g>

        <!-- Activation Bars -->
        <rect x="105" y="105" width="10" height="580" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
        <rect x="305" y="115" width="10" height="150" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>
        <rect x="525" y="145" width="10" height="110" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>
        <rect x="745" y="170" width="10" height="65" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
        <rect x="945" y="190" width="10" height="35" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>

        <!-- Phase 1 Divider / Header -->
        <rect x="30" y="96" width="1000" height="22" rx="4" fill="#f1f5f9"/>
        <text x="40" y="112" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#475569">BAGIAN 1: PENCATATAN SIDANG HASIL ASESMEN (EHA)</text>

        <!-- Message 1: Admin -> View -->
        <line x1="115" y1="130" x2="305" y2="130" stroke="#0284c7" stroke-width="1.75" marker-end="url(#d13-arrow)"/>
        <text x="210" y="124" font-family="'Geist', sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">1. Input Sidang EHA &amp; Tanggal</text>

        <!-- Message 2: View -> Ctrl -->
        <line x1="315" y1="155" x2="525" y2="155" stroke="#0284c7" stroke-width="1.75" marker-end="url(#d13-arrow)"/>
        <text x="420" y="149" font-family="'Geist Mono', monospace" font-size="10" fill="#0369a1" text-anchor="middle">2. POST /assessments/{id}/eha (eha_date, notes)</text>

        <!-- Message 3: Ctrl -> Model -->
        <line x1="535" y1="180" x2="745" y2="180" stroke="#0284c7" stroke-width="1.75" marker-end="url(#d13-arrow)"/>
        <text x="640" y="174" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0369a1" text-anchor="middle">3. update(eha_status: SUDAH_EHA)</text>

        <!-- Message 4: Model -> DB -->
        <line x1="755" y1="200" x2="945" y2="200" stroke="#0284c7" stroke-width="1.75" marker-end="url(#d13-arrow)"/>
        <text x="850" y="194" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a" text-anchor="middle">4. UPDATE assessments</text>

        <!-- Message 5: DB -> Ctrl (Return) -->
        <line x1="945" y1="225" x2="535" y2="225" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d13-arrow-dash)"/>
        <text x="740" y="219" font-family="'Geist Mono', monospace" font-size="9" fill="#475569" text-anchor="middle">5. 200 OK Saved</text>

        <!-- Message 6: Ctrl -> View -->
        <line x1="525" y1="250" x2="315" y2="250" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d13-arrow-dash)"/>
        <text x="420" y="244" font-family="'Geist', sans-serif" font-size="10" fill="#475569" text-anchor="middle">6. Render Status EHA Terkonfirmasi</text>

        <!-- Phase 2: Quality Gate Section -->
        <rect x="30" y="280" width="1000" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="40" y="296" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#0369a1">BAGIAN 2: PENEGAKAN QUALITY GATE KESIAPAN TERBIT SK AKREDITASI</text>

        <!-- Activation Bars Phase 2 -->
        <rect x="305" y="320" width="10" height="350" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>
        <rect x="525" y="340" width="10" height="320" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>

        <!-- Message 7: Admin -> View -->
        <line x1="115" y1="330" x2="305" y2="330" stroke="#0284c7" stroke-width="1.75" marker-end="url(#d13-arrow)"/>
        <text x="210" y="324" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="middle">7. Klik [ Rilis SK Akreditasi ]</text>

        <!-- Message 8: View -> Ctrl -->
        <line x1="315" y1="355" x2="525" y2="355" stroke="#0284c7" stroke-width="1.75" marker-end="url(#d13-arrow)"/>
        <text x="420" y="349" font-family="'Geist Mono', monospace" font-size="10" fill="#0369a1" text-anchor="middle">8. POST /accreditations/{id}/release</text>

        <!-- Self Call: Ctrl -> Ctrl (isReleaseReady()) -->
        <path d="M535 370 C575 370, 575 395, 535 395" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#d13-arrow)"/>
        <text x="585" y="386" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#0369a1">9. isReleaseReady()</text>
        <text x="585" y="400" font-family="'Geist', sans-serif" font-size="8.5" fill="#64748b">Cek: TP SATISFIED &amp;&amp; SUDAH_EHA</text>

        <!-- Alt Box Frame -->
        <rect x="40" y="420" width="980" height="260" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="40" y="420" width="70" height="22" rx="4" fill="#e2e8f0"/>
        <text x="75" y="435" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">alt</text>

        <!-- Alt 1: Syarat Belum Lengkap -->
        <text x="130" y="436" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#be123c">[ Syarat Belum Lengkap / Quality Gate Lock ]</text>

        <line x1="525" y1="460" x2="315" y2="460" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d13-arrow-red)"/>
        <text x="420" y="454" font-family="'Geist Mono', monospace" font-size="9.5" fill="#be123c" text-anchor="middle">10. HTTP 422: SK Terkunci (Quality Gate Lock)</text>

        <line x1="305" y1="485" x2="115" y2="485" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d13-arrow-red)"/>
        <text x="210" y="479" font-family="'Geist', sans-serif" font-size="10" fill="#be123c" text-anchor="middle">11. SweetAlert2: Syarat TP / EHA Belum Lengkap</text>

        <!-- Alt Divider -->
        <line x1="40" y1="510" x2="1020" y2="510" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="130" y="526" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#15803d">[ Syarat Lengkap: Status TP SATISFIED &amp;&amp; Sudah EHA ]</text>

        <!-- Activation Bars in Alt 2 -->
        <rect x="745" y="540" width="10" height="50" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
        <rect x="945" y="560" width="10" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>

        <!-- Message 12: Ctrl -> Model -->
        <line x1="535" y1="545" x2="745" y2="545" stroke="#16a34a" stroke-width="1.75" marker-end="url(#d13-arrow-green)"/>
        <text x="640" y="539" font-family="'Geist Mono', monospace" font-size="9" fill="#15803d" text-anchor="middle">12. update(sk_number, sk_issued_at: now())</text>

        <!-- Message 13: Model -> DB -->
        <line x1="755" y1="565" x2="945" y2="565" stroke="#16a34a" stroke-width="1.75" marker-end="url(#d13-arrow-green)"/>
        <text x="850" y="559" font-family="'Geist Mono', monospace" font-size="8.5" fill="#15803d" text-anchor="middle">13. UPDATE accreditations</text>

        <!-- Message 14: DB -> Ctrl -->
        <line x1="945" y1="595" x2="535" y2="595" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d13-arrow-green)"/>
        <text x="740" y="589" font-family="'Geist Mono', monospace" font-size="9" fill="#15803d" text-anchor="middle">14. 200 OK Saved</text>

        <!-- Message 15: Ctrl -> View -->
        <line x1="525" y1="625" x2="315" y2="625" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d13-arrow-green)"/>
        <text x="420" y="619" font-family="'Geist', sans-serif" font-size="10" fill="#15803d" text-anchor="middle">15. Status Rilis Dokumen SK Aktif</text>

        <!-- Message 16: View -> Admin -->
        <line x1="305" y1="655" x2="115" y2="655" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d13-arrow-green)"/>
        <text x="210" y="649" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">16. Toast Sukses: SK Akreditasi Resmi Dirilis</text>

        <!-- Participant Boxes (Bottom) -->
        <g transform="translate(40, 696)">
          <rect width="140" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="70" y="22" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#0f172a" text-anchor="middle">Admin Unit Lab</text>
        </g>
        <g transform="translate(240, 696)">
          <rect width="140" height="36" rx="6" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="70" y="22" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#0369a1" text-anchor="middle">Detail Page</text>
        </g>
        <g transform="translate(450, 696)">
          <rect width="160" height="36" rx="6" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="80" y="22" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#0369a1" text-anchor="middle">AssessmentController</text>
        </g>
        <g transform="translate(680, 696)">
          <rect width="140" height="36" rx="6" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="70" y="22" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#6d28d9" text-anchor="middle">Assessment Model</text>
        </g>
        <g transform="translate(880, 696)">
          <rect width="140" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="70" y="22" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#0f172a" text-anchor="middle">SQLite Database</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
