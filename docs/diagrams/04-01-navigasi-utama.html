<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Struktur Navigasi Utama Sistem SIMASADI · SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1160px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">NAVIGASI UTAMA · SIMASADI</p>
    <h1>Struktur Navigasi Utama Sistem SIMASADI</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
        <title id="d1-title">Struktur Navigasi Utama Sistem SIMASADI</title>
        <desc id="d1-desc">Diagram struktur navigasi tingkat utama menghubungkan otentikasi sesi login, dasbor eksekutif, serta empat menu utama operasional yang saling terhubung horizontal.</desc>
        <defs>
          <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
          </marker>
        </defs>

        <rect width="1000" height="460" fill="#f8fafc" rx="8"/>

        <!-- Connectors -->
        <!-- Login <-> Dashboard -->
        <line x1="190" y1="210" x2="270" y2="210" stroke="#0284c7" stroke-width="1.6" marker-end="url(#d1-arrow-accent)"/>
        <line x1="270" y1="210" x2="190" y2="210" stroke="#0284c7" stroke-width="1.6" marker-end="url(#d1-arrow-accent)"/>

        <!-- Dashboard to Bus Trunk -->
        <line x1="470" y1="210" x2="550" y2="210" stroke="#475569" stroke-width="1.4"/>

        <!-- Bus Trunk Vertical Backbone -->
        <line x1="550" y1="80" x2="550" y2="380" stroke="#475569" stroke-width="1.4"/>

        <!-- Branches to 4 Menus -->
        <line x1="550" y1="80" x2="630" y2="80" stroke="#475569" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
        <line x1="550" y1="180" x2="630" y2="180" stroke="#475569" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
        <line x1="550" y1="280" x2="630" y2="280" stroke="#475569" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
        <line x1="550" y1="380" x2="630" y2="380" stroke="#475569" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

        <!-- Inter-Menu Bi-directional Ring (Horizontal links on the right) -->
        <path d="M 870 80 L 910 80 L 910 380 L 870 380" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
        <line x1="870" y1="180" x2="910" y2="180" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
        <line x1="870" y1="280" x2="910" y2="280" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>

        <!-- Node: Login -->
        <g transform="translate(40, 175)">
          <rect width="150" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
          <text x="14" y="24" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">AUTENTIKASI</text>
          <text x="14" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="700">Halaman Login</text>
          <text x="14" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/login &bull; reCAPTCHA v2</text>
        </g>

        <!-- Node: Dashboard (Focal Hero) -->
        <g transform="translate(270, 165)">
          <rect width="200" height="90" rx="8" fill="rgba(2,132,199,0.06)" stroke="#0284c7" stroke-width="1.8"/>
          <text x="16" y="26" fill="#0284c7" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" letter-spacing="0.14em">PUSAT OPERASIONAL</text>
          <text x="16" y="48" fill="#0f172a" font-size="15" font-family="'Geist', sans-serif" font-weight="700">Dashboard Utama</text>
          <text x="16" y="65" fill="#475569" font-size="9.5" font-family="'Geist Mono', monospace">/dashboard &bull; KPI &amp; Alert</text>
          <text x="16" y="78" fill="#16a34a" font-size="8.5" font-family="'Geist Mono', monospace">Peran: Ketua Tim &amp; PIC Lab</text>
        </g>

        <!-- 4 Main Menus -->
        <!-- Menu 1: LPK -->
        <g transform="translate(630, 45)">
          <rect width="240" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">MODUL 1 · MASTER DATA</text>
          <text x="16" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Data Master LPK</text>
          <text x="16" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/lpks &bull; Profil, Lingkup &amp; PIC</text>
        </g>

        <!-- Menu 2: Asesmen -->
        <g transform="translate(630, 145)">
          <rect width="240" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">MODUL 2 · AGENDA KAN</text>
          <text x="16" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Program Asesmen</text>
          <text x="16" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/assessments &bull; 8 Skema &amp; SLA TP</text>
        </g>

        <!-- Menu 3: Kalender -->
        <g transform="translate(630, 245)">
          <rect width="240" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">MODUL 3 · KOORDINASI</text>
          <text x="16" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Kalender Pengawasan</text>
          <text x="16" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/calendar &bull; Multi-Event Grid</text>
        </g>

        <!-- Menu 4: Profil & Tim -->
        <g transform="translate(630, 345)">
          <rect width="240" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">MODUL 4 · AKUN &amp; TIM</text>
          <text x="16" y="44" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Profil &amp; Kolaborasi Tim</text>
          <text x="16" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">/profile &bull; Tautan Akun PIC</text>
        </g>

        <!-- Bottom Legend -->
        <text x="40" y="440" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace">STRUKTUR TINGKAT UTAMA &bull; GARIS PUTUS-PUTUS MENUNJUKKAN TAUTAN HORIZONTAL ANTAR-MODUL TANPA KEMBALI KE DASBOR</text>
      </svg>
    </div>
  </div>
</body>
</html>
