<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alur Kerja Lengkap 1 Siklus Akreditasi Penuh (8 Skema KAN) · SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --color-purple:  #7c3aed;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1160px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">LIFECYCLE MAP · 8 SKEMA AKREDITASI</p>
    <h1>Alur Kerja Lengkap 1 Siklus Akreditasi Penuh (8 Skema KAN)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d8-title d8-desc">
        <title id="d8-title">Alur Kerja Lengkap 1 Siklus Akreditasi Penuh (8 Skema KAN)</title>
        <desc id="d8-desc">Diagram peta fase siklus hidup 5 tahun (60 bulan) akreditasi KAN, memetakan 8 tahapan asesmen mulai dari Akreditasi Awal hingga Re-Akreditasi.</desc>
        <defs>
          <marker id="d8-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="d8-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker>
        </defs>

        <rect width="1100" height="560" fill="#f8fafc" rx="8"/>

        <!-- Main Flow Track (Top Line: Stage 1 -> Eval 1 -> S1 / S1+PRL) -->
        <line x1="80" y1="90" x2="120" y2="90" stroke="#475569" stroke-width="1.2" marker-end="url(#d8-arrow)"/>
        <line x1="280" y1="90" x2="330" y2="90" stroke="#475569" stroke-width="1.2" marker-end="url(#d8-arrow)"/>

        <!-- Eval 1 -> Stage 2 (Top) & Stage 3 (Bottom) -->
        <path d="M 430 90 L 480 90 L 480 60 L 520 60" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#d8-arrow)"/>
        <path d="M 430 90 L 480 90 L 480 130 L 520 130" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#d8-arrow)"/>

        <!-- Stages 2 & 3 -> Eval 3 -->
        <path d="M 700 60 L 740 60 L 740 90 L 780 90" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#d8-arrow)"/>
        <path d="M 700 130 L 740 130 L 740 90 L 780 90" fill="none" stroke="#475569" stroke-width="1.2"/>

        <!-- Eval 3 -> Stage 4 (Top) & Stage 5 (Bottom) -->
        <path d="M 880 90 L 920 90 L 920 60 L 950 60" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#d8-arrow)"/>
        <path d="M 880 90 L 920 90 L 920 130 L 950 130" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#d8-arrow)"/>

        <!-- Stages 4 & 5 -> Track Re-Akreditasi (Down to Bottom Row) -->
        <path d="M 1020 160 L 1020 220 L 880 220" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#d8-arrow-accent)"/>

        <!-- Bottom Track: Re-Akreditasi Row -->
        <line x1="680" y1="220" x2="620" y2="220" stroke="#0284c7" stroke-width="1.4" marker-end="url(#d8-arrow-accent)"/>
        <line x1="420" y1="220" x2="360" y2="220" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d8-arrow)"/>

        <!-- Side Box Container: Jalur Khusus / Insidental -->
        <rect x="40" y="310" width="1020" height="190" rx="10" fill="rgba(241,245,249,0.7)" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,4"/>
        <text x="60" y="336" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" font-weight="700" letter-spacing="0.14em">JALUR KHUSUS / KONDISIONAL (KAPAN SAJA SELAMA SIKLUS 5 TAHUN)</text>

        <!-- NODES TOP ROW -->
        <!-- Start -->
        <g transform="translate(40, 75)"><circle cx="15" cy="15" r="14" fill="#0f172a"/></g>

        <!-- Stage 1: Akreditasi Awal (120, 55) -->
        <g transform="translate(120, 55)">
          <rect width="160" height="70" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <text x="12" y="20" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">TAHAP 1 &bull; BULAN KE-0</text>
          <text x="12" y="36" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="700">Akreditasi Awal (AA)</text>
          <text x="12" y="48" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">SLA TP: 3 Bulan</text>
          <text x="12" y="60" fill="#16a34a" font-size="8.5" font-family="'Geist Mono', monospace">Terbit SK 5 Thn (ACTIVE)</text>
        </g>

        <!-- Eval Year 1 (Center: 380, 90) -->
        <g transform="translate(380, 90)">
          <polygon points="0,-35 50,0 0,35 -50,0" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="0" y="-4" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">EVALUASI TAHUN 1</text>
          <text x="0" y="8" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Bulan 13-24</text>
        </g>

        <!-- Stage 2: S1 Rutin (520, 30) -->
        <g transform="translate(520, 30)">
          <rect width="180" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="10" y="18" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">TAHAP 2 &bull; SURVEILEN 1</text>
          <text x="10" y="32" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Survailen 1 (S1 Rutin)</text>
          <text x="10" y="44" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">Audit mutu &bull; TP 2 Bulan</text>
        </g>

        <!-- Stage 3: S1 + PRL (520, 100) -->
        <g transform="translate(520, 100)">
          <rect width="180" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="10" y="18" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">TAHAP 3 &bull; TAMBAH LINGKUP</text>
          <text x="10" y="32" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Survailen 1 + PRL</text>
          <text x="10" y="44" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">Audit rutin + adendum lingkup</text>
        </g>

        <!-- Eval Year 3 (Center: 830, 90) -->
        <g transform="translate(830, 90)">
          <polygon points="0,-35 50,0 0,35 -50,0" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="0" y="-4" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">EVALUASI TAHUN 3</text>
          <text x="0" y="8" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Bulan 34-48</text>
        </g>

        <!-- Stage 4: S2 Rutin (950, 30) -->
        <g transform="translate(950, 30)">
          <rect width="130" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="8" y="18" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">TAHAP 4 &bull; S2</text>
          <text x="8" y="32" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Survailen 2</text>
          <text x="8" y="44" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">Audit tahun ke-3</text>
        </g>

        <!-- Stage 5: S2 + PRL (950, 100) -->
        <g transform="translate(950, 100)">
          <rect width="130" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="8" y="18" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">TAHAP 5 &bull; S2+PRL</text>
          <text x="8" y="32" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">S2 + Perluasan</text>
          <text x="8" y="44" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">Audit + uji unjuk kerja</text>
        </g>

        <!-- MIDDLE ROW: PERSIAPAN & RE-AKREDITASI -->
        <!-- Track Re-Akreditasi (880, 190) -->
        <g transform="translate(680, 190)">
          <rect width="200" height="60" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
          <text x="12" y="20" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">PERSIAPAN AKHIR SIKLUS</text>
          <text x="12" y="36" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Persiapan Re-Akreditasi</text>
          <text x="12" y="48" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Reminder Kritis Bulan ke-54</text>
        </g>

        <!-- Stage 8: Re-Akreditasi (Focal Hero: 420, 185) -->
        <g transform="translate(420, 180)">
          <rect width="200" height="80" rx="8" fill="rgba(2,132,199,0.06)" stroke="#0284c7" stroke-width="1.8"/>
          <text x="14" y="22" fill="#0284c7" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">TAHAP 8 &bull; BULAN 48-60</text>
          <text x="14" y="42" fill="#0f172a" font-size="13.5" font-family="'Geist', sans-serif" font-weight="700">Re-Akreditasi Penuh</text>
          <text x="14" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">Full Re-Assessment Sistem &amp; Lingkup</text>
          <text x="14" y="70" fill="#16a34a" font-size="8.5" font-family="'Geist Mono', monospace">Quality Gate: Terbit Sertifikat Baru 5 Thn</text>
        </g>

        <!-- End Terminal Node: Reset & Mulai Siklus Baru (120, 195) -->
        <g transform="translate(120, 185)">
          <rect width="240" height="70" rx="8" fill="rgba(22,163,74,0.06)" stroke="#16a34a" stroke-width="1.5"/>
          <text x="14" y="22" fill="#16a34a" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">SIKLUS 1 SELESAI PENUH</text>
          <text x="14" y="40" fill="#14532d" font-size="12" font-family="'Geist', sans-serif" font-weight="700">Reset &amp; Siklus Baru</text>
          <text x="14" y="54" fill="#15803d" font-size="8.5" font-family="'Geist Mono', monospace">Status COMPLETED &bull; Lanjut 5 Tahun Ke-2</text>
        </g>

        <!-- SIDE BOX NODES (Kondisional) -->
        <!-- Stage 6: STT -->
        <g transform="translate(80, 360)">
          <rect width="440" height="110" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
          <text x="14" y="24" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">SKEMA 6 &bull; INSIDENTAL (AD-HOC)</text>
          <text x="14" y="44" fill="#0f172a" font-size="12.5" font-family="'Geist', sans-serif" font-weight="700">Survailen Tidak Terjadwal (STT)</text>
          <text x="14" y="62" fill="#475569" font-size="9.5" font-family="'Geist', sans-serif">Pemicu: Aduan publik, relokasi lab, pergantian personel kunci,</text>
          <text x="14" y="78" fill="#475569" font-size="9.5" font-family="'Geist', sans-serif">atau verifikasi pemulihan status DIBEKUKAN.</text>
          <text x="14" y="96" fill="#0284c7" font-size="8.5" font-family="'Geist Mono', monospace">Batas SLA TP: Maksimal 2 Bulan &bull; Rekomendasi EHA Khusus</text>
        </g>

        <!-- Stage 7: PRL Mandiri -->
        <g transform="translate(560, 360)">
          <rect width="460" height="110" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
          <text x="14" y="24" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">SKEMA 7 &bull; NON-PERIODIK (MANDIRI)</text>
          <text x="14" y="44" fill="#0f172a" font-size="12.5" font-family="'Geist', sans-serif" font-weight="700">Perluasan Ruang Lingkup (PRL Mandiri)</text>
          <text x="14" y="62" fill="#475569" font-size="9.5" font-family="'Geist', sans-serif">Pemicu: Permohonan adendum penambahan lingkup pengujian</text>
          <text x="14" y="78" fill="#475569" font-size="9.5" font-family="'Geist', sans-serif">di luar jadwal surveilen rutin 5 tahunan.</text>
          <text x="14" y="96" fill="#0284c7" font-size="8.5" font-family="'Geist Mono', monospace">Asesmen Teknis Metode Baru &bull; Terbit Adendum Ruang Lingkup</text>
        </g>

        <!-- Footer -->
        <text x="40" y="530" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace">PETA SIKLUS HIDUP 5 TAHUN &bull; 8 TAHAPAN SESUAI REGULASI KAN U-01 &bull; DIKAWAL SEPENUHNYA OLEH PIC LABORATORIUM</text>
      </svg>
    </div>
  </div>
</body>
</html>
