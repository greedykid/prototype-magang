<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Use Case Diagram: Pembagian Hak Akses 2 Peran Nyata · SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1160px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">USE CASE DIAGRAM · SIMASADI</p>
    <h1>Use Case Diagram: Pembagian Hak Akses 2 Peran Nyata</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1080 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
        <title id="d3-title">Use Case Diagram: Pembagian Hak Akses 2 Peran Nyata</title>
        <desc id="d3-desc">Diagram Use Case UML memetakan hak akses fitur Ketua Tim (Admin) dan PIC Laboratorium dalam batas sistem SIMASADI.</desc>
        <defs>
          <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
        </defs>

        <rect width="1080" height="580" fill="#f8fafc" rx="8"/>

        <!-- Boundary Box -->
        <rect x="220" y="30" width="640" height="520" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="240" y="56" fill="#0284c7" font-size="9" font-family="'Geist Mono', monospace" font-weight="700" letter-spacing="0.14em">BATAS SISTEM: SIMASADI PROTOTYPE</text>

        <!-- Actor 1: Ketua Tim (Left) -->
        <g transform="translate(40, 200)">
          <rect width="140" height="110" rx="8" fill="rgba(2,132,199,0.06)" stroke="#0284c7" stroke-width="1.6"/>
          <circle cx="70" cy="35" r="16" fill="#f1f5f9" stroke="#0284c7" stroke-width="1.4"/>
          <text x="70" y="40" fill="#0284c7" font-size="13" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">👤</text>
          <text x="70" y="68" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Ketua Tim</text>
          <text x="70" y="82" fill="#0284c7" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Role: admin</text>
          <text x="70" y="96" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Hak Penuh &amp; Rilis SK</text>
        </g>

        <!-- Actor 2: PIC Lab (Right) -->
        <g transform="translate(900, 200)">
          <rect width="140" height="110" rx="8" fill="rgba(22,163,74,0.06)" stroke="#16a34a" stroke-width="1.6"/>
          <circle cx="70" cy="35" r="16" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.4"/>
          <text x="70" y="40" fill="#16a34a" font-size="13" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">👤</text>
          <text x="70" y="68" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">PIC Lab</text>
          <text x="70" y="82" fill="#16a34a" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Role: pic</text>
          <text x="70" y="96" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Pendamping Binaan</text>
        </g>

        <!-- Association Lines from Left Actor (Ketua Tim) -->
        <line x1="180" y1="230" x2="260" y2="85" stroke="#0284c7" stroke-width="1"/>
        <line x1="180" y1="240" x2="260" y2="135" stroke="#0284c7" stroke-width="1"/>
        <line x1="180" y1="250" x2="260" y2="185" stroke="#0284c7" stroke-width="1"/>
        <line x1="180" y1="260" x2="260" y2="235" stroke="#0284c7" stroke-width="1"/>
        <line x1="180" y1="270" x2="260" y2="285" stroke="#0284c7" stroke-width="1"/>
        <line x1="180" y1="280" x2="260" y2="335" stroke="#0284c7" stroke-width="1"/>
        <line x1="180" y1="290" x2="260" y2="385" stroke="#0284c7" stroke-width="1"/>
        <line x1="180" y1="300" x2="260" y2="435" stroke="#0284c7" stroke-width="1"/>
        <line x1="180" y1="305" x2="260" y2="485" stroke="#0284c7" stroke-width="1"/>

        <!-- Association Lines from Right Actor (PIC Lab) -->
        <line x1="900" y1="230" x2="620" y2="85" stroke="#16a34a" stroke-width="1"/>
        <line x1="900" y1="240" x2="620" y2="135" stroke="#16a34a" stroke-width="1"/>
        <line x1="900" y1="250" x2="620" y2="185" stroke="#16a34a" stroke-width="1"/>
        <line x1="900" y1="265" x2="620" y2="285" stroke="#16a34a" stroke-width="1"/>
        <line x1="900" y1="275" x2="620" y2="335" stroke="#16a34a" stroke-width="1"/>
        <line x1="900" y1="285" x2="620" y2="435" stroke="#16a34a" stroke-width="1"/>
        <line x1="900" y1="295" x2="620" y2="485" stroke="#16a34a" stroke-width="1"/>

        <!-- Use Cases inside boundary (9 Rows) -->
        <!-- UC 1: Login & Profil -->
        <g transform="translate(260, 70)">
          <rect width="360" height="32" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
          <text x="180" y="20" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">UC-01: Melakukan Login Sesi &amp; Kelola Profil</text>
        </g>

        <!-- UC 2: Dashboard & Alert -->
        <g transform="translate(260, 120)">
          <rect width="360" height="32" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
          <text x="180" y="20" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">UC-02: Memantau Dashboard &amp; Alert Persisten Pengawasan</text>
        </g>

        <!-- UC 3: Master LPK -->
        <g transform="translate(260, 170)">
          <rect width="360" height="32" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
          <text x="180" y="20" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">UC-03: Mengelola Data Master Lembaga (LPK) &amp; Ruang Lingkup</text>
        </g>

        <!-- UC 4: Impor Massal (Admin Only) -->
        <g transform="translate(260, 220)">
          <rect width="360" height="32" rx="16" fill="rgba(2,132,199,0.06)" stroke="#0284c7" stroke-width="1.3"/>
          <text x="180" y="20" fill="#0284c7" font-size="10.5" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">UC-04: Mengimpor Massal LPK / Asesmen &amp; Live Feed (Admin)</text>
        </g>

        <!-- UC 5: 8 Tipe Asesmen -->
        <g transform="translate(260, 270)">
          <rect width="360" height="32" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
          <text x="180" y="20" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">UC-05: Menjadwalkan &amp; Mengelola 8 Tipe Asesmen KAN U-01</text>
        </g>

        <!-- UC 6: SLA TP & VTP -->
        <g transform="translate(260, 320)">
          <rect width="360" height="32" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
          <text x="180" y="20" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">UC-06: Mengawal Batas SLA Tindakan Perbaikan (TP &amp; VTP)</text>
        </g>

        <!-- UC 7: Sidang EHA & Quality Gate (Admin Only) -->
        <g transform="translate(260, 370)">
          <rect width="360" height="32" rx="16" fill="rgba(2,132,199,0.06)" stroke="#0284c7" stroke-width="1.3"/>
          <text x="180" y="20" fill="#0284c7" font-size="10.5" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">UC-07: Sidang EHA &amp; Penerbitan SK (Quality Gate Lock - Admin)</text>
        </g>

        <!-- UC 8: Kalender Kerja -->
        <g transform="translate(260, 420)">
          <rect width="360" height="32" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
          <text x="180" y="20" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">UC-08: Mengelola Agenda Kalender Interaktif 5 Tipe Event</text>
        </g>

        <!-- UC 9: Kolaborasi Akun PIC -->
        <g transform="translate(260, 470)">
          <rect width="360" height="32" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
          <text x="180" y="20" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">UC-09: Penautan Relasi Akun Tim &amp; Hak Akses Viewer PIC</text>
        </g>

        <!-- Legend / Footer -->
        <g transform="translate(240, 520)">
          <rect width="10" height="10" rx="2" fill="rgba(2,132,199,0.1)" stroke="#0284c7" stroke-width="1"/>
          <text x="16" y="9" fill="#0284c7" font-size="8.5" font-family="'Geist Mono', monospace">Eksklusif Ketua Tim (Admin)</text>
          <rect x="220" y="0" width="10" height="10" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
          <text x="236" y="9" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Dapat Diakses Kedua Peran (PIC Scoped)</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
