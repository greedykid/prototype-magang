<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entity Relationship Diagram (ERD) Basis Data SIMASADI · SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --color-purple:  #7c3aed;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1160px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DIAGRAM 4.14 · BASIS DATA</p>
    <h1>Entity Relationship Diagram (ERD) Basis Data SIMASADI</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1120 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d14-title d14-desc">
        <title id="d14-title">Entity Relationship Diagram (ERD) Basis Data SIMASADI</title>
        <desc id="d14-desc">Struktur skema basis data relasional SIMASADI: tabel USERS, LPKS, ASSESSMENTS, ACCREDITATIONS, CALENDAR_EVENTS, dan BACKUPS beserta atribut kunci PK/FK dan kardinalitas relasi.</desc>
        <defs>
          <marker id="d14-crow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><circle cx="2" cy="5" r="2" fill="#475569"/><line x1="2" y1="1" x2="8" y2="5" stroke="#475569" stroke-width="1.2"/><line x1="2" y1="9" x2="8" y2="5" stroke="#475569" stroke-width="1.2"/><line x1="2" y1="5" x2="8" y2="5" stroke="#475569" stroke-width="1.2"/></marker>
          <marker id="d14-one" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><line x1="3" y1="1" x2="3" y2="7" stroke="#475569" stroke-width="1.5"/><line x1="6" y1="1" x2="6" y2="7" stroke="#475569" stroke-width="1.5"/></marker>
        </defs>

        <rect width="1120" height="720" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

        <!-- ENTITY 1: USERS (Top Left) -->
        <g transform="translate(30, 30)">
          <rect width="210" height="190" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="210" height="32" rx="8" fill="#0284c7"/>
          <text x="105" y="21" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">USERS</text>
          
          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#0284c7">PK</text>
          <text x="40" y="52" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">id: BIGINT</text>

          <text x="40" y="74" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">name: VARCHAR(100)</text>
          <text x="40" y="96" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">email: VARCHAR(100)</text>
          <text x="40" y="118" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">password: VARCHAR(100)</text>
          <text x="40" y="140" font-family="'Geist Mono', monospace" font-size="10" fill="#0284c7">role: admin | pic</text>
          <text x="40" y="162" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">email_verified_at</text>
          <text x="40" y="180" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">created_at, updated_at</text>
        </g>

        <!-- ENTITY 2: LPKS (Center Top) -->
        <g transform="translate(300, 30)">
          <rect width="240" height="280" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="240" height="32" rx="8" fill="#0284c7"/>
          <text x="120" y="21" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">LPKS (Master LPK)</text>

          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#0284c7">PK</text>
          <text x="40" y="52" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">id: BIGINT</text>

          <text x="14" y="74" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#d97706">UQ</text>
          <text x="40" y="74" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">no_reg: VARCHAR(30)</text>

          <text x="40" y="96" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">registration_number</text>
          <text x="40" y="118" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">name: VARCHAR(150)</text>
          <text x="40" y="140" font-family="'Geist Mono', monospace" font-size="10" fill="#0284c7">kan_schema: VARCHAR(50)</text>
          <text x="40" y="162" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">scope: TEXT</text>
          <text x="40" y="184" font-family="'Geist Mono', monospace" font-size="10" fill="#0284c7">status: ACTIVE | SUSP...</text>
          <text x="40" y="206" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">certificate_date: DATE</text>
          <text x="40" y="228" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">expired_at: DATE (5 Thn)</text>
          
          <text x="14" y="250" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#7c3aed">FK</text>
          <text x="40" y="250" font-family="'Geist Mono', monospace" font-size="10" fill="#7c3aed">pic_id &rarr; users.id</text>

          <text x="40" y="270" font-family="'Geist Mono', monospace" font-size="9.5" fill="#64748b">drive_url, notes, timestamps</text>
        </g>

        <!-- ENTITY 3: ASSESSMENTS (Top Right) -->
        <g transform="translate(600, 30)">
          <rect width="250" height="350" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="250" height="32" rx="8" fill="#0284c7"/>
          <text x="125" y="21" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">ASSESSMENTS</text>

          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#0284c7">PK</text>
          <text x="40" y="52" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">id: BIGINT</text>

          <text x="14" y="74" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#7c3aed">FK</text>
          <text x="40" y="74" font-family="'Geist Mono', monospace" font-size="10" fill="#7c3aed">lpk_id &rarr; lpks.id</text>

          <text x="14" y="96" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#7c3aed">FK</text>
          <text x="40" y="96" font-family="'Geist Mono', monospace" font-size="10" fill="#7c3aed">created_by &rarr; users.id</text>

          <text x="40" y="118" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">title: VARCHAR(150)</text>
          <text x="40" y="140" font-family="'Geist Mono', monospace" font-size="10" fill="#0284c7">assessment_type (8 KAN)</text>
          <text x="40" y="162" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">start_at, end_at</text>
          <text x="40" y="184" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">lead_assessor: VARCHAR</text>
          <text x="40" y="206" font-family="'Geist Mono', monospace" font-size="10" fill="#0284c7">status: PLANNED | COMPL...</text>

          <line x1="14" y1="216" x2="236" y2="216" stroke="#e2e8f0" stroke-width="1"/>

          <text x="40" y="232" font-family="'Geist Mono', monospace" font-size="9.5" fill="#d97706">tp_sla_months (3 AA, 2 Lain)</text>
          <text x="40" y="250" font-family="'Geist Mono', monospace" font-size="9.5" fill="#d97706">tp_due_date, tp_has_ext</text>
          <text x="40" y="268" font-family="'Geist Mono', monospace" font-size="9.5" fill="#d97706">tp_extended_due_date</text>
          <text x="40" y="286" font-family="'Geist Mono', monospace" font-size="9.5" fill="#16a34a">tp_satisfied_at: DATE</text>

          <line x1="14" y1="296" x2="236" y2="296" stroke="#e2e8f0" stroke-width="1"/>

          <text x="40" y="312" font-family="'Geist Mono', monospace" font-size="9.5" fill="#7c3aed">eha_status, eha_date</text>
          <text x="40" y="330" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">sk_number, sk_issued_at</text>
        </g>

        <!-- ENTITY 4: ACCREDITATIONS (Far Right) -->
        <g transform="translate(890, 30)">
          <rect width="200" height="230" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="200" height="32" rx="8" fill="#0284c7"/>
          <text x="100" y="21" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">ACCREDITATIONS</text>

          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#0284c7">PK</text>
          <text x="40" y="52" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">id: BIGINT</text>

          <text x="14" y="74" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#7c3aed">FK</text>
          <text x="40" y="74" font-family="'Geist Mono', monospace" font-size="10" fill="#7c3aed">lpk_id &rarr; lpks.id</text>

          <text x="40" y="96" font-family="'Geist Mono', monospace" font-size="10" fill="#0284c7">status: NOT_STARTED...</text>
          <text x="40" y="118" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">start_date: DATE</text>
          <text x="40" y="140" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">pantek_at: DATE</text>
          <text x="40" y="162" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">target_output_at: DATE</text>
          <text x="40" y="184" font-family="'Geist Mono', monospace" font-size="10" fill="#16a34a">output_released_at</text>
          <text x="40" y="206" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">pic: VARCHAR, notes</text>
        </g>

        <!-- ENTITY 5: CALENDAR_EVENTS (Bottom Left) -->
        <g transform="translate(30, 430)">
          <rect width="230" height="230" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="230" height="32" rx="8" fill="#0284c7"/>
          <text x="115" y="21" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">CALENDAR_EVENTS</text>

          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#0284c7">PK</text>
          <text x="40" y="52" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">id: BIGINT</text>

          <text x="14" y="74" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#7c3aed">FK</text>
          <text x="40" y="74" font-family="'Geist Mono', monospace" font-size="10" fill="#7c3aed">lpk_id &rarr; lpks.id</text>

          <text x="14" y="96" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#7c3aed">FK</text>
          <text x="40" y="96" font-family="'Geist Mono', monospace" font-size="10" fill="#7c3aed">created_by &rarr; users.id</text>

          <text x="40" y="118" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">title: VARCHAR(150)</text>
          <text x="40" y="140" font-family="'Geist Mono', monospace" font-size="10" fill="#0284c7">event_type (5 Jenis)</text>
          <text x="40" y="162" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">start_at, end_at</text>
          <text x="40" y="184" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">location, is_all_day</text>
          <text x="40" y="206" font-family="'Geist Mono', monospace" font-size="9.5" fill="#64748b">notes, created_at</text>
        </g>

        <!-- ENTITY 6: LPK_MEMBERS & USER_ACCOUNT_LINKS (Bottom Center) -->
        <g transform="translate(300, 430)">
          <rect width="240" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect width="240" height="28" rx="8" fill="#475569"/>
          <text x="120" y="19" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">LPK_MEMBERS</text>

          <text x="14" y="46" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">PK id: BIGINT</text>
          <text x="14" y="66" font-family="'Geist Mono', monospace" font-size="9.5" fill="#7c3aed">FK lpk_id &rarr; lpks.id</text>
          <text x="14" y="86" font-family="'Geist Mono', monospace" font-size="9.5" fill="#7c3aed">FK user_id &rarr; users.id</text>
          <text x="14" y="102" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">role: viewer</text>
        </g>

        <g transform="translate(300, 560)">
          <rect width="240" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect width="240" height="28" rx="8" fill="#475569"/>
          <text x="120" y="19" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">USER_ACCOUNT_LINKS</text>

          <text x="14" y="46" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">PK id: BIGINT</text>
          <text x="14" y="66" font-family="'Geist Mono', monospace" font-size="9.5" fill="#7c3aed">FK user_id &rarr; users.id (Owner)</text>
          <text x="14" y="86" font-family="'Geist Mono', monospace" font-size="9.5" fill="#7c3aed">FK viewer_id &rarr; users.id</text>
          <text x="14" y="102" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">timestamps</text>
        </g>

        <!-- ENTITY 7: BACKUPS (Bottom Right) -->
        <g transform="translate(600, 480)">
          <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect width="220" height="28" rx="8" fill="#475569"/>
          <text x="110" y="19" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">BACKUPS (Audit Trail)</text>

          <text x="14" y="46" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">PK id: BIGINT</text>
          <text x="14" y="66" font-family="'Geist Mono', monospace" font-size="9.5" fill="#7c3aed">FK recorded_by &rarr; users.id</text>
          <text x="14" y="86" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">filename: VARCHAR</text>
          <text x="14" y="106" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">size_bytes: INT</text>
          <text x="14" y="126" font-family="'Geist Mono', monospace" font-size="9.5" fill="#16a34a">is_successful: BOOL</text>
          <text x="14" y="142" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">created_at</text>
        </g>

        <!-- RELATIONSHIP CONNECTIONS -->
        <!-- Users 1 - Lpks -->
        <path d="M240 100 L300 100" fill="none" stroke="#475569" stroke-width="1.5"/>
        <text x="270" y="94" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7" text-anchor="middle">1:N</text>

        <!-- Lpks 1 - Assessments -->
        <path d="M540 120 L600 120" fill="none" stroke="#475569" stroke-width="1.5"/>
        <text x="570" y="114" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7" text-anchor="middle">1:N</text>

        <!-- Lpks 1 - Accreditations -->
        <path d="M540 70 L890 70" fill="none" stroke="#475569" stroke-width="1.5"/>
        <text x="860" y="64" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7" text-anchor="middle">1:N</text>

        <!-- Users 1 - Assessments (loop over top) -->
        <path d="M135 30 L135 15 L725 15 L725 30" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="430" y="12" font-family="'Geist Mono', monospace" font-size="9" fill="#7c3aed" text-anchor="middle">created_by (1:N)</text>

        <!-- Users 1 - Calendar Events -->
        <path d="M100 220 L100 430" fill="none" stroke="#475569" stroke-width="1.5"/>
        <text x="115" y="320" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7" text-anchor="middle">1:N</text>

        <!-- Lpks 1 - Calendar Events -->
        <path d="M300 250 L200 250 L200 430" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="210" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#475569">1:N</text>

        <!-- Users 1 - Backups -->
        <path d="M210 220 L210 390 L620 390 L620 480" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="400" y="384" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">records (1:N)</text>
      </svg>
    </div>
  </div>
</body>
</html>
