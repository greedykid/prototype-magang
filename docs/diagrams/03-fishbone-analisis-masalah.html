<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisis Sebab-Akibat · Fishbone Diagram SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-accent:  #0284c7;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1360px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 1080px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Ishikawa Root-Cause · SIMASADI Analisis</p>
    <h1>Analisis Sebab-Akibat Masalah: Keterlambatan Siklus Akreditasi KAN</h1>

    <div class="diagram-container">
      <svg viewBox="-40 0 1480 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fishbone-title fishbone-desc">
        <title id="fishbone-title">Fishbone Diagram Sebab-Akibat SIMASADI</title>
        <desc id="fishbone-desc">Diagram sebab-akibat (Ishikawa) membedah 4 kategori faktor penyebab keterlambatan siklus akreditasi KAN, mengonfirmasi ketiadaan otomatisasi sistem dan Quality Gate sebagai akar masalah utama.</desc>
        <defs>
          <marker id="fishbone-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0f172a"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect x="-40" y="0" width="1480" height="620" fill="#f8fafc" rx="8"/>

        <!-- Spine -->
        <line x1="160" y1="320" x2="1160" y2="320" stroke="#0f172a" stroke-width="1.5" marker-end="url(#fishbone-arrow)"/>

        <!-- Bone 1: Regulasi & Metode (Above, k=1) -->
        <line x1="940" y1="320" x2="844" y2="152" stroke="#475569" stroke-width="1.2"/>

        <!-- Bone 2: Sistem & Alat - ROOT CAUSE (Below, k=2) -->
        <line x1="760" y1="320" x2="664" y2="488" stroke="#0284c7" stroke-width="1.6"/>

        <!-- Bone 3: Faktor Manusia (Above, k=3) -->
        <line x1="580" y1="320" x2="484" y2="152" stroke="#475569" stroke-width="1.2"/>

        <!-- Bone 4: Integritas Data (Below, k=4) -->
        <line x1="400" y1="320" x2="304" y2="488" stroke="#475569" stroke-width="1.2"/>

        <!-- Sub-causes Bone 1: Regulasi & Metode -->
        <line x1="908" y1="264" x2="876" y2="264" stroke="#64748b" stroke-width="1"/>
        <text x="870" y="260" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Aturan toleransi surveilen belum tersistem</text>
        <line x1="876" y1="208" x2="844" y2="208" stroke="#64748b" stroke-width="1"/>
        <text x="838" y="204" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Penegakan SLA TP KAN belum otomatis</text>

        <!-- Sub-causes Bone 2: Sistem & Alat (ROOT CAUSE) -->
        <line x1="728" y1="376" x2="696" y2="376" stroke="#0284c7" stroke-width="1"/>
        <text x="690" y="388" fill="#0284c7" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="end">Tampilan kaku &amp; rawan salah input status</text>
        <line x1="696" y1="432" x2="664" y2="432" stroke="#0284c7" stroke-width="1.2"/>
        <text x="658" y="444" fill="#0284c7" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">Belum ada kontrol Quality Gate rilis SK</text>

        <!-- Sub-causes Bone 3: Faktor Manusia -->
        <line x1="548" y1="264" x2="516" y2="264" stroke="#64748b" stroke-width="1"/>
        <text x="510" y="260" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Kurang visibilitas pengawasan lintas PIC</text>
        <line x1="516" y1="208" x2="484" y2="208" stroke="#64748b" stroke-width="1"/>
        <text x="478" y="204" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Koordinasi manual perpanjangan waktu</text>

        <!-- Sub-causes Bone 4: Integritas Data -->
        <line x1="368" y1="376" x2="336" y2="376" stroke="#64748b" stroke-width="1"/>
        <text x="330" y="388" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Pencatatan riwayat asesmen terfragmentasi</text>
        <line x1="336" y1="432" x2="304" y2="432" stroke="#64748b" stroke-width="1"/>
        <text x="298" y="444" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Data surveilen lampau berstatus menggantung</text>

        <!-- Category Tags (outer ends of bones) -->
        <!-- Tag 1: Regulasi & Metode (far_x=844, far_y=152) -->
        <g transform="translate(844, 152)">
          <rect x="-80" y="-16" width="160" height="32" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
          <text x="0" y="4" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Regulasi &amp; Metode</text>
        </g>

        <!-- Tag 2: Sistem & Alat - ROOT CAUSE (far_x=664, far_y=488) -->
        <g transform="translate(664, 488)">
          <rect x="-95" y="-16" width="190" height="32" rx="4" fill="rgba(2,132,199,0.08)" stroke="#0284c7" stroke-width="1.5"/>
          <text x="0" y="4" fill="#0284c7" font-size="11" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Sistem &amp; Alat (Akar Masalah)</text>
        </g>

        <!-- Tag 3: Faktor Manusia (far_x=484, far_y=152) -->
        <g transform="translate(484, 152)">
          <rect x="-70" y="-16" width="140" height="32" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
          <text x="0" y="4" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Faktor Manusia</text>
        </g>

        <!-- Tag 4: Integritas Data (far_x=304, far_y=488) -->
        <g transform="translate(304, 488)">
          <rect x="-70" y="-16" width="140" height="32" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
          <text x="0" y="4" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Integritas Data</text>
        </g>

        <!-- Effect Box (Head of Spine, x=1160, y=260, w=260, h=120) -->
        <g transform="translate(1160, 260)">
          <rect width="260" height="120" rx="8" fill="rgba(2,132,199,0.06)" stroke="#0284c7" stroke-width="1.5"/>
          <text x="18" y="28" fill="#0284c7" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" letter-spacing="0.14em">EFEK TERAMATI (MASALAH UTAMA)</text>
          <text x="18" y="52" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="700" line-height="1.3">Risiko Keterlambatan</text>
          <text x="18" y="70" fill="#0f172a" font-size="13" font-family="'Geist', sans-serif" font-weight="700">Siklus Akreditasi KAN</text>
          <text x="18" y="94" fill="#475569" font-size="9.5" font-family="'Geist Mono', monospace">Ketidakpatuhan Pedoman KAN U-01</text>
          <text x="18" y="106" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace">&bull; Batas SLA Lewat &bull; Suspend Menggantung</text>
        </g>

        <!-- Legend / Callout Box Bottom Left -->
        <g transform="translate(40, 560)">
          <rect width="12" height="12" rx="2" fill="rgba(2,132,199,0.12)" stroke="#0284c7" stroke-width="1.2"/>
          <text x="20" y="10" fill="#0284c7" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">Akar Masalah Terkonfirmasi (SIMASADI fokus mengotomatisasi Sistem &amp; Kontrol)</text>
          <rect x="520" y="0" width="12" height="12" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
          <text x="540" y="10" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">Faktor Kontributor yang Ditangani melalui Validasi &amp; RBAC</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
