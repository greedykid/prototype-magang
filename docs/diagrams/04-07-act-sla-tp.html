<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Diagram: Alur Penegakan SLA Tindakan Perbaikan (TP) · SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --color-purple:  #7c3aed;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1160px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ACTIVITY DIAGRAM · SLA TP & VTP</p>
    <h1>Activity Diagram: Alur Penegakan SLA Tindakan Perbaikan (TP)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1020 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d7-title d7-desc">
        <title id="d7-title">Activity Diagram: Alur Penegakan SLA Tindakan Perbaikan (TP)</title>
        <desc id="d7-desc">Diagram alur penegakan batas waktu SLA tindakan perbaikan (TP &amp; VTP) sesuai regulasi KAN U-01 dan aturan perpanjangan waktu resmi maksimal 1 bulan.</desc>
        <defs>
          <marker id="d7-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="d7-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker>
          <marker id="d7-arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e11d48"/></marker>
          <marker id="d7-arrow-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#16a34a"/></marker>
        </defs>

        <rect width="1020" height="500" fill="#f8fafc" rx="8"/>

        <!-- Top Flow -->
        <line x1="80" y1="100" x2="120" y2="100" stroke="#475569" stroke-width="1.2" marker-end="url(#d7-arrow)"/>
        <line x1="260" y1="100" x2="300" y2="100" stroke="#475569" stroke-width="1.2" marker-end="url(#d7-arrow)"/>
        <line x1="450" y1="100" x2="490" y2="100" stroke="#475569" stroke-width="1.2" marker-end="url(#d7-arrow)"/>
        <line x1="640" y1="100" x2="680" y2="100" stroke="#475569" stroke-width="1.2" marker-end="url(#d7-arrow)"/>

        <!-- Choice 1: Permohonan Perpanjangan? (Center: 730, 100) -->
        <!-- Choice 1 -> Ditolak / Nihil (Right) -->
        <line x1="780" y1="100" x2="850" y2="100" stroke="#e11d48" stroke-width="1.5" marker-end="url(#d7-arrow-danger)"/>
        <rect x="785" y="84" width="60" height="14" rx="2" fill="#f8fafc"/>
        <text x="815" y="94" fill="#e11d48" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">PROGRES NIHIL</text>

        <!-- Choice 1 -> Disetujui (Down) -->
        <line x1="730" y1="145" x2="730" y2="210" stroke="#0284c7" stroke-width="1.5" marker-end="url(#d7-arrow-accent)"/>
        <rect x="650" y="165" width="160" height="16" rx="3" fill="#f8fafc"/>
        <text x="730" y="177" fill="#0284c7" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">ADA BUKTI RIIL + SURAT RESMI</text>

        <!-- Middle Flow: Input Surat & Perpanjang 1 Bulan -->
        <line x1="640" y1="245" x2="570" y2="245" stroke="#0284c7" stroke-width="1.3" marker-end="url(#d7-arrow-accent)"/>

        <!-- Middle -> Choice 2: Evaluasi Pemenuhan (Down) -->
        <line x1="475" y1="280" x2="475" y2="340" stroke="#475569" stroke-width="1.3" marker-end="url(#d7-arrow)"/>

        <!-- Choice 2 -> Selesai / Memenuhi (Left) -->
        <line x1="425" y1="380" x2="350" y2="380" stroke="#16a34a" stroke-width="1.6" marker-end="url(#d7-arrow-success)"/>
        <rect x="360" y="364" width="60" height="14" rx="2" fill="#f8fafc"/>
        <text x="390" y="374" fill="#16a34a" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TERPENUHI</text>

        <!-- Selesai -> Trigger SK -->
        <line x1="190" y1="380" x2="150" y2="380" stroke="#16a34a" stroke-width="1.4" marker-end="url(#d7-arrow-success)"/>

        <!-- Choice 2 -> Lewat Batas (Right & Up to Suspended) -->
        <path d="M 525 380 L 920 380 L 920 145" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#d7-arrow-danger)"/>
        <rect x="660" y="370" width="130" height="16" rx="3" fill="#f8fafc"/>
        <text x="725" y="382" fill="#e11d48" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LEWAT BATAS &amp; TIDAK TUNTAS</text>

        <!-- NODES -->
        <!-- Start -->
        <g transform="translate(40, 85)"><circle cx="15" cy="15" r="14" fill="#0f172a"/></g>

        <!-- Node 1: Asesmen Selesai -->
        <g transform="translate(120, 65)">
          <rect width="140" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">CLOSING MEETING</text>
          <text x="12" y="40" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Laporan Temuan</text>
          <text x="12" y="54" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Realisasi Selesai (end_at)</text>
        </g>

        <!-- Node 2: Hitung SLA Dasar -->
        <g transform="translate(300, 65)">
          <rect width="150" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">SLA REGULASI KAN</text>
          <text x="12" y="40" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Tentukan Batas Awal</text>
          <text x="12" y="54" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">AA: 3 Bln &bull; Lainnya: 2 Bln</text>
        </g>

        <!-- Node 3: Status Berlangsung -->
        <g transform="translate(490, 65)">
          <rect width="150" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">STATUS AKTIF</text>
          <text x="12" y="40" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Sedang Berlangsung</text>
          <text x="12" y="54" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Countdown Hari Tersisa</text>
        </g>

        <!-- Choice 1: Permohonan Perpanjangan (Center: 730, 100) -->
        <g transform="translate(730, 100)">
          <polygon points="0,-45 50,0 0,45 -50,0" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <text x="0" y="-8" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">PERMOHONAN</text>
          <text x="0" y="8" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Perpanjangan?</text>
          <text x="0" y="20" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+1 Bln Bersyarat</text>
        </g>

        <!-- Node Suspended (Right: 850, 65) -->
        <g transform="translate(850, 65)">
          <rect width="140" height="70" rx="6" fill="rgba(225,29,72,0.06)" stroke="#e11d48" stroke-width="1.4"/>
          <text x="12" y="22" fill="#e11d48" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">DIBEKUKAN</text>
          <text x="12" y="40" fill="#9f1239" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Status SUSPENDED</text>
          <text x="12" y="54" fill="#b91c1c" font-size="8.5" font-family="'Geist Mono', monospace">Tolak / Lewat Tempo</text>
        </g>

        <!-- Node 4: Input Surat & Aktifkan Perpanjangan (640, 210) -->
        <g transform="translate(640, 210)">
          <rect width="180" height="70" rx="6" fill="rgba(2,132,199,0.06)" stroke="#0284c7" stroke-width="1.3"/>
          <text x="12" y="22" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">SURAT RESMI DISETUJUI</text>
          <text x="12" y="40" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Input No. Surat LPK</text>
          <text x="12" y="54" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">tp_extension_letter_no</text>
        </g>

        <!-- Node 5: SLA Extended (+1 Bulan) (380, 210) -->
        <g transform="translate(380, 210)">
          <rect width="190" height="70" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
          <text x="12" y="22" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">BATAS BARU EFEKTIF</text>
          <text x="12" y="40" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">SLA Diperpanjang 1 Bulan</text>
          <text x="12" y="54" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">effective_tp_due_date</text>
        </g>

        <!-- Choice 2: Cek Pemenuhan (Center: 475, 380) -->
        <g transform="translate(475, 380)">
          <polygon points="0,-40 50,0 0,40 -50,0" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
          <text x="0" y="-6" fill="#16a34a" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">EVALUASI VTP</text>
          <text x="0" y="8" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Memenuhi?</text>
          <text x="0" y="20" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tp_satisfied_at</text>
        </g>

        <!-- Node 6: Status Memenuhi / Selesai (190, 345) -->
        <g transform="translate(190, 345)">
          <rect width="160" height="70" rx="6" fill="rgba(22,163,74,0.06)" stroke="#16a34a" stroke-width="1.5"/>
          <text x="12" y="22" fill="#16a34a" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">VERIFIKASI TUNTAS</text>
          <text x="12" y="40" fill="#14532d" font-size="12" font-family="'Geist', sans-serif" font-weight="700">Status SATISFIED</text>
          <text x="12" y="54" fill="#15803d" font-size="8.5" font-family="'Geist Mono', monospace">Dinyatakan Memenuhi</text>
        </g>

        <!-- Node 7: Trigger SK 10 Hari (40, 345) -->
        <g transform="translate(40, 345)">
          <rect width="110" height="70" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
          <text x="8" y="22" fill="#16a34a" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">PENGINGAT SK</text>
          <text x="8" y="40" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="700">Trigger 10 Hari</text>
          <text x="8" y="54" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Kesiapan Rilis</text>
        </g>

        <!-- Footer -->
        <text x="40" y="465" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace">ATURAN SLA TINDAKAN PERBAIKAN &bull; PERPANJANGAN WAJIB MELAMPIRKAN PROGRES NYATA &amp; NOMOR SURAT RESMI</text>
      </svg>
    </div>
  </div>
</body>
</html>
