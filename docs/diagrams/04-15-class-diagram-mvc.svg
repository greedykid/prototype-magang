<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d15-title d15-desc" id="d-04-15-class-diagram-mvc-root">
        <title id="d15-title">Class Diagram SIMASADI (Arsitektur Model &amp; Controller MVC Laravel)</title>
        <desc id="d15-desc">Diagram kelas berorientasi objek sistem SIMASADI mencakup model Eloquent User, Lpk, Assessment, Accreditation, CalendarEvent, LpkMember, dan UserAccountLink beserta atribut, metode komputasi bisnis, dan relasinya.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-04-15-class-diagram-mvc-root { --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --color-purple:  #7c3aed;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-04-15-class-diagram-mvc-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-04-15-class-diagram-mvc-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-04-15-class-diagram-mvc-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-04-15-class-diagram-mvc-d15-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker>
          <marker id="d-04-15-class-diagram-mvc-d15-assoc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><polygon points="0 5, 8 2, 8 8" fill="#475569"/></marker>
        </defs>

        <rect width="1120" height="780" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

        <!-- CLASS 1: User (Top Left) -->
        <g transform="translate(30, 30)">
          <rect width="220" height="230" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="220" height="32" rx="8" fill="#0284c7"/>
          <text x="110" y="21" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">User</text>

          <!-- Attributes -->
          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+int id</text>
          <text x="14" y="68" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+string name</text>
          <text x="14" y="84" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+string email</text>
          <text x="14" y="100" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">+string role</text>

          <line x1="10" y1="110" x2="210" y2="110" stroke="#e2e8f0" stroke-width="1"/>

          <!-- Methods -->
          <text x="14" y="128" font-family="'Geist Mono', monospace" font-size="9" fill="#16a34a">+isAdmin(): bool</text>
          <text x="14" y="144" font-family="'Geist Mono', monospace" font-size="9" fill="#16a34a">+isPic(): bool</text>
          <text x="14" y="160" font-family="'Geist Mono', monospace" font-size="9" fill="#16a34a">+isAssessor(): bool</text>
          <text x="14" y="176" font-family="'Geist Mono', monospace" font-size="9" fill="#16a34a">+isLpk(): bool</text>
          <text x="14" y="194" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+lpks(): HasMany</text>
          <text x="14" y="210" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+assessments(): HasMany</text>
        </g>

        <!-- CLASS 2: Lpk (Top Center) -->
        <g transform="translate(300, 30)">
          <rect width="250" height="310" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="250" height="32" rx="8" fill="#0284c7"/>
          <text x="125" y="21" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Lpk</text>

          <!-- Attributes -->
          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+int id</text>
          <text x="14" y="68" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+string no_reg</text>
          <text x="14" y="84" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+string name</text>
          <text x="14" y="100" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">+string kan_schema</text>
          <text x="14" y="116" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+date certificate_date</text>
          <text x="14" y="132" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+date expired_at</text>
          <text x="14" y="148" font-family="'Geist Mono', monospace" font-size="9.5" fill="#7c3aed">+int pic_user_id</text>

          <line x1="10" y1="156" x2="240" y2="156" stroke="#e2e8f0" stroke-width="1"/>

          <!-- Methods -->
          <text x="14" y="174" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+scopeAccessibleBy(query, user)</text>
          <text x="14" y="190" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+scopeManageableBy(query, user)</text>
          <text x="14" y="206" font-family="'Geist Mono', monospace" font-size="9" fill="#16a34a">+canManage(user): bool</text>
          <text x="14" y="222" font-family="'Geist Mono', monospace" font-size="9" fill="#16a34a">+canView(user): bool</text>
          <text x="14" y="238" font-family="'Geist Mono', monospace" font-size="9" fill="#d97706">+getDynamicStatusAttribute()</text>
          <text x="14" y="254" font-family="'Geist Mono', monospace" font-size="9" fill="#d97706">+getSurveillanceMilestones()</text>
          <text x="14" y="272" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+assessments(): HasMany</text>
          <text x="14" y="288" font-family="'Geist Mono', monospace" font-size="9" fill="#7c3aed">+picUser(): BelongsTo</text>
        </g>

        <!-- CLASS 3: Assessment (Top Right) -->
        <g transform="translate(600, 30)">
          <rect width="250" height="340" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="250" height="32" rx="8" fill="#0284c7"/>
          <text x="125" y="21" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Assessment</text>

          <!-- Attributes -->
          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+int id</text>
          <text x="14" y="68" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">+string assessment_type</text>
          <text x="14" y="84" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+datetime start_at, end_at</text>
          <text x="14" y="100" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">+string status</text>
          <text x="14" y="116" font-family="'Geist Mono', monospace" font-size="9.5" fill="#d97706">+int tp_sla_months</text>
          <text x="14" y="132" font-family="'Geist Mono', monospace" font-size="9.5" fill="#d97706">+date tp_due_date</text>
          <text x="14" y="148" font-family="'Geist Mono', monospace" font-size="9.5" fill="#16a34a">+date tp_satisfied_at</text>

          <line x1="10" y1="156" x2="240" y2="156" stroke="#e2e8f0" stroke-width="1"/>

          <!-- Methods -->
          <text x="14" y="174" font-family="'Geist Mono', monospace" font-size="9" fill="#d97706">+getEffectiveTpDueDateAttribute()</text>
          <text x="14" y="190" font-family="'Geist Mono', monospace" font-size="9" fill="#e11d48">+getIsTpOverdueAttribute(): bool</text>
          <text x="14" y="206" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+getTpDynamicStatusAttribute()</text>
          <text x="14" y="222" font-family="'Geist Mono', monospace" font-size="9" fill="#e11d48">+getIsSubmissionOverdue(): bool</text>
          <text x="14" y="238" font-family="'Geist Mono', monospace" font-size="9" fill="#e11d48">+getIsSuspensionExpired(): bool</text>
          <text x="14" y="256" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+lpk(): BelongsTo</text>
          <text x="14" y="272" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+creator(): BelongsTo</text>
        </g>

        <!-- CLASS 4: Accreditation (Far Right) -->
        <g transform="translate(890, 30)">
          <rect width="200" height="200" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="200" height="32" rx="8" fill="#0284c7"/>
          <text x="100" y="21" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Accreditation</text>

          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+int id</text>
          <text x="14" y="68" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">+string status</text>
          <text x="14" y="84" font-family="'Geist Mono', monospace" font-size="9.5" fill="#16a34a">+date output_released_at</text>

          <line x1="10" y1="94" x2="190" y2="94" stroke="#e2e8f0" stroke-width="1"/>

          <text x="14" y="114" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#7c3aed">+isReleaseReady(): bool</text>
          <text x="14" y="132" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+lpk(): BelongsTo</text>
          <text x="14" y="150" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+calendarEvents(): HasMany</text>
        </g>

        <!-- CLASS 5: CalendarEvent (Bottom Left) -->
        <g transform="translate(30, 420)">
          <rect width="220" height="200" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <rect width="220" height="32" rx="8" fill="#0284c7"/>
          <text x="110" y="21" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">CalendarEvent</text>

          <text x="14" y="52" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+int id</text>
          <text x="14" y="68" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">+string event_type</text>
          <text x="14" y="84" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+datetime start_at, end_at</text>
          <text x="14" y="100" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+string location</text>

          <line x1="10" y1="110" x2="210" y2="110" stroke="#e2e8f0" stroke-width="1"/>

          <text x="14" y="130" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+lpk(): BelongsTo</text>
          <text x="14" y="148" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+creator(): BelongsTo</text>
        </g>

        <!-- CLASS 6: LpkMember (Bottom Center) -->
        <g transform="translate(300, 420)">
          <rect width="240" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect width="240" height="30" rx="8" fill="#475569"/>
          <text x="120" y="20" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">LpkMember</text>

          <text x="14" y="50" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+int id, lpk_id, user_id</text>
          <text x="14" y="68" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0284c7">+string role</text>

          <line x1="10" y1="78" x2="230" y2="78" stroke="#e2e8f0" stroke-width="1"/>

          <text x="14" y="98" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+lpk(): BelongsTo</text>
          <text x="14" y="116" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+user(): BelongsTo</text>
        </g>

        <!-- CLASS 7: UserAccountLink (Bottom Right) -->
        <g transform="translate(600, 420)">
          <rect width="240" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect width="240" height="30" rx="8" fill="#475569"/>
          <text x="120" y="20" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">UserAccountLink</text>

          <text x="14" y="50" font-family="'Geist Mono', monospace" font-size="9.5" fill="#0f172a">+int id, user_id, viewer_id</text>

          <line x1="10" y1="62" x2="230" y2="62" stroke="#e2e8f0" stroke-width="1"/>

          <text x="14" y="82" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+user(): BelongsTo</text>
          <text x="14" y="100" font-family="'Geist Mono', monospace" font-size="9" fill="#0284c7">+viewer(): BelongsTo</text>
        </g>

        <!-- ASSOCIATIONS WITH MULTIPLICITIES -->
        <!-- User 1 -> * Lpk -->
        <path d="M250 110 L300 110" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#d-04-15-class-diagram-mvc-d15-assoc)"/>
        <text x="258" y="102" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">1</text>
        <text x="286" y="102" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">*</text>
        <text x="275" y="124" font-family="'Geist', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">assigns</text>

        <!-- Lpk 1 -> * Assessment -->
        <path d="M550 110 L600 110" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#d-04-15-class-diagram-mvc-d15-assoc)"/>
        <text x="558" y="102" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">1</text>
        <text x="586" y="102" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">*</text>
        <text x="575" y="124" font-family="'Geist', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">undergoes</text>

        <!-- Lpk 1 -> * Accreditation -->
        <path d="M550 60 L890 60" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#d-04-15-class-diagram-mvc-d15-assoc)"/>
        <text x="558" y="52" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">1</text>
        <text x="876" y="52" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">*</text>
        <text x="720" y="52" font-family="'Geist', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">holds</text>

        <!-- User 1 -> * Assessment (Curve over top) -->
        <path d="M140 30 L140 12 L725 12 L725 30" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#d-04-15-class-diagram-mvc-d15-assoc)"/>
        <text x="430" y="9" font-family="'Geist', sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">creates (1 : *)</text>

        <!-- User 1 -> * CalendarEvent -->
        <path d="M90 260 L90 420" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#d-04-15-class-diagram-mvc-d15-assoc)"/>
        <text x="96" y="278" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">1</text>
        <text x="96" y="410" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">*</text>

        <!-- Lpk 1 -> * LpkMember -->
        <path d="M420 340 L420 420" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#d-04-15-class-diagram-mvc-d15-assoc)"/>
        <text x="426" y="358" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">1</text>
        <text x="426" y="410" font-family="'Geist Mono', monospace" font-size="9" fill="#0f172a">*</text>
        <text x="444" y="380" font-family="'Geist', sans-serif" font-size="9" fill="#64748b">includes</text>

        <!-- User 1 -> * UserAccountLink -->
        <path d="M210 260 L210 390 L680 390 L680 420" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#d-04-15-class-diagram-mvc-d15-assoc)"/>
        <text x="445" y="384" font-family="'Geist', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">links (1 : *)</text>
      </svg>
