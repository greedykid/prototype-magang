<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siklus Hidup 3 Tahap Pengawasan Surveilen KAN · SIMASADI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #f1f5f9;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-accent:  #0284c7;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger:  #e11d48;
      --color-purple:  #7c3aed;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1160px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">STATE DIAGRAM · SIKLUS SURVEILEN</p>
    <h1>Siklus Hidup 3 Tahap Pengawasan Surveilen KAN</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1060 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6-title d6-desc">
        <title id="d6-title">Siklus Hidup 3 Tahap Pengawasan Surveilen KAN</title>
        <desc id="d6-desc">Diagram transisi status pengawasan surveilen mulai dari asesmen lapangan, masa toleransi 4 bulan, pembekuan 1 tahun (SUSPENDED), pemulihan status (ACTIVE), hingga pencabutan resmi (REVOKED).</desc>
        <defs>
          <marker id="d6-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="d6-arrow-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#16a34a"/></marker>
          <marker id="d6-arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/></marker>
          <marker id="d6-arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e11d48"/></marker>
        </defs>

        <rect width="1060" height="520" fill="#f8fafc" rx="8"/>

        <!-- Flow Lines Top Row -->
        <line x1="80" y1="110" x2="120" y2="110" stroke="#475569" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
        <line x1="260" y1="110" x2="300" y2="110" stroke="#475569" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
        <line x1="460" y1="110" x2="500" y2="110" stroke="#475569" stroke-width="1.2" marker-end="url(#d6-arrow)"/>

        <!-- Decision 1 -> Path Normal (Right) -->
        <line x1="600" y1="110" x2="680" y2="110" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d6-arrow-success)"/>
        <rect x="608" y="94" width="64" height="14" rx="2" fill="#f8fafc"/>
        <text x="640" y="104" fill="#16a34a" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">&le; 4 BULAN</text>

        <!-- Path Normal -> Completed End -->
        <line x1="850" y1="110" x2="920" y2="110" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d6-arrow-success)"/>

        <!-- Decision 1 -> Path Pembekuan (Down) -->
        <line x1="550" y1="155" x2="550" y2="230" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#d6-arrow-purple)"/>
        <rect x="490" y="180" width="120" height="16" rx="3" fill="#f8fafc"/>
        <text x="550" y="192" fill="#7c3aed" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">&gt; 4 BULAN (OVERDUE)</text>

        <!-- Suspension Boundary Container -->
        <rect x="180" y="240" width="840" height="230" rx="10" fill="rgba(124,58,237,0.03)" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6,4"/>
        <text x="200" y="264" fill="#7c3aed" font-size="9" font-family="'Geist Mono', monospace" font-weight="700" letter-spacing="0.14em">JALUR TOLERANSI PEMBEKUAN: JENDELA WAKTU 1 TAHUN (SUSPENDED)</text>

        <!-- Inside Suspension Container Flows -->
        <!-- Step: Aktifkan Pembekuan (550, 280) -->
        <!-- Decision 2: Selesai dlm 1 tahun? -->
        <line x1="550" y1="340" x2="550" y2="370" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#d6-arrow-purple)"/>

        <!-- Decision 2 -> YA: Pemulihan (Left) -->
        <line x1="500" y1="410" x2="420" y2="410" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d6-arrow-success)"/>
        <rect x="430" y="394" width="80" height="14" rx="2" fill="#f8fafc"/>
        <text x="470" y="404" fill="#16a34a" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">YA (SELESAI)</text>

        <!-- Pemulihan -> Active End -->
        <line x1="260" y1="410" x2="220" y2="410" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d6-arrow-success)"/>

        <!-- Decision 2 -> TIDAK: Pencabutan (Right) -->
        <line x1="600" y1="410" x2="680" y2="410" stroke="#e11d48" stroke-width="1.6" marker-end="url(#d6-arrow-danger)"/>
        <rect x="608" y="394" width="70" height="14" rx="2" fill="#f8fafc"/>
        <text x="643" y="404" fill="#e11d48" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">&gt; 1 TAHUN</text>

        <!-- Revoked -> Terminal End -->
        <line x1="860" y1="410" x2="920" y2="410" stroke="#e11d48" stroke-width="1.5" marker-end="url(#d6-arrow-danger)"/>

        <!-- NODES TOP ROW -->
        <!-- Start -->
        <g transform="translate(40, 95)"><circle cx="15" cy="15" r="14" fill="#0f172a"/></g>

        <!-- Node 1: Kunjungan Asesmen -->
        <g transform="translate(120, 75)">
          <rect width="140" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">TAHAP 1 &bull; AUDIT</text>
          <text x="12" y="40" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Kunjungan Asesmen</text>
          <text x="12" y="54" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Realisasi Selesai (end_at)</text>
        </g>

        <!-- Node 2: Hitung Toleransi -->
        <g transform="translate(300, 75)">
          <rect width="160" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="12" y="22" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">TAHAP 2 &bull; ATURAN KAN</text>
          <text x="12" y="40" fill="#0f172a" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Hitung Toleransi</text>
          <text x="12" y="54" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Bulan 15 + 4 Bln Toleransi</text>
        </g>

        <!-- Choice 1: Cek Batas 4 Bulan (Center: 550, 110) -->
        <g transform="translate(550, 110)">
          <polygon points="0,-45 50,0 0,45 -50,0" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
          <text x="0" y="-8" fill="#0284c7" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">EVALUASI</text>
          <text x="0" y="8" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Batas 4 Bulan?</text>
          <text x="0" y="20" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">submission_due</text>
        </g>

        <!-- Node 3: Status Normal (Right) -->
        <g transform="translate(680, 75)">
          <rect width="170" height="70" rx="6" fill="rgba(22,163,74,0.06)" stroke="#16a34a" stroke-width="1.4"/>
          <text x="12" y="22" fill="#16a34a" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">STATUS NORMAL &bull; ACTIVE</text>
          <text x="12" y="40" fill="#14532d" font-size="12" font-family="'Geist', sans-serif" font-weight="700">Asesmen Selesai</text>
          <text x="12" y="54" fill="#15803d" font-size="8.5" font-family="'Geist Mono', monospace">Status COMPLETED &bull; Terbit SK</text>
        </g>

        <!-- Completed End -->
        <g transform="translate(930, 95)">
          <circle cx="15" cy="15" r="15" fill="none" stroke="#16a34a" stroke-width="1.5"/>
          <circle cx="15" cy="15" r="10" fill="#16a34a"/>
        </g>

        <!-- NODES INSIDE SUSPENSION CONTAINER -->
        <!-- Node 4: Status Dibekukan (Center Top: 460, 280) -->
        <g transform="translate(460, 275)">
          <rect width="180" height="65" rx="6" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.5"/>
          <text x="12" y="20" fill="#7c3aed" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">STATUS: SUSPENDED (DIBEKUKAN)</text>
          <text x="12" y="38" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="700">Jendela Toleransi 1 Tahun</text>
          <text x="12" y="52" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Countdown Hari &amp; Bulan Aktif</text>
        </g>

        <!-- Choice 2: Cek 1 Tahun (Center: 550, 410) -->
        <g transform="translate(550, 410)">
          <polygon points="0,-40 50,0 0,40 -50,0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
          <text x="0" y="-6" fill="#7c3aed" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">EVALUASI 1 TAHUN</text>
          <text x="0" y="8" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="700" text-anchor="middle">Tuntas?</text>
        </g>

        <!-- Node 5: Pemulihan (Left: 260, 380) -->
        <g transform="translate(260, 380)">
          <rect width="160" height="60" rx="6" fill="rgba(22,163,74,0.06)" stroke="#16a34a" stroke-width="1.3"/>
          <text x="12" y="20" fill="#16a34a" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">PEMULIHAN STATUS</text>
          <text x="12" y="36" fill="#14532d" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Status Kembali ACTIVE</text>
          <text x="12" y="48" fill="#15803d" font-size="8.5" font-family="'Geist Mono', monospace">Kewajiban Dipenuhi</text>
        </g>

        <!-- Recovered End -->
        <g transform="translate(190, 395)">
          <circle cx="15" cy="15" r="15" fill="none" stroke="#16a34a" stroke-width="1.5"/>
          <circle cx="15" cy="15" r="10" fill="#16a34a"/>
        </g>

        <!-- Node 6: Cabut Akreditasi (Right: 680, 380) -->
        <g transform="translate(680, 380)">
          <rect width="180" height="60" rx="6" fill="rgba(225,29,72,0.06)" stroke="#e11d48" stroke-width="1.5"/>
          <text x="12" y="20" fill="#e11d48" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">PENCABUTAN RESMI</text>
          <text x="12" y="36" fill="#9f1239" font-size="11.5" font-family="'Geist', sans-serif" font-weight="700">Status Menjadi REVOKED</text>
          <text x="12" y="48" fill="#b91c1c" font-size="8.5" font-family="'Geist Mono', monospace">1 Tahun Lewat Tanpa Solusi</text>
        </g>

        <!-- Revoked End -->
        <g transform="translate(930, 395)">
          <circle cx="15" cy="15" r="15" fill="none" stroke="#e11d48" stroke-width="1.5"/>
          <circle cx="15" cy="15" r="10" fill="#e11d48"/>
        </g>

        <!-- Footer -->
        <text x="40" y="495" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace">ATURAN PENEGAKAN SURVEILEN KAN U-01 &bull; TOLERANSI 4 BULAN DARI BULAN KE-15 &bull; PEMBEKUAN MAKSIMAL 1 TAHUN SEBELUM REVOKED</text>
      </svg>
    </div>
  </div>
</body>
</html>
